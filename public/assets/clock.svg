<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="clockBezel" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4df3ff"/>
      <stop offset="65%" stop-color="#00a8cc"/>
      <stop offset="100%" stop-color="#006080"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f7fa"/>
    </linearGradient>
  </defs>
  <!-- Top ring/button -->
  <path d="M17 5 C17 3 23 3 23 5 L23 7 L17 7 Z" fill="#00a8cc"/>
  <circle cx="20" cy="4" r="3.5" fill="none" stroke="#00a8cc" stroke-width="1.8"/>
  <!-- Bezel -->
  <circle cx="20" cy="22" r="15" fill="url(#clockBezel)"/>
  <!-- Dial Face -->
  <circle cx="20" cy="22" r="12" fill="url(#faceGrad)"/>
  <!-- Hour markers -->
  <circle cx="20" cy="13" r="1.2" fill="#006080"/>
  <circle cx="29" cy="22" r="1.2" fill="#006080"/>
  <circle cx="20" cy="31" r="1.2" fill="#006080"/>
  <circle cx="11" cy="22" r="1.2" fill="#006080"/>
  <!-- Hands pointing to ~10:10 with smooth tip -->
  <line x1="20" y1="22" x2="15" y2="17" stroke="#113344" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="20" y1="22" x2="25" y2="18" stroke="#0088aa" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center pin -->
  <circle cx="20" cy="22" r="2" fill="#ff3366"/>
</svg>

