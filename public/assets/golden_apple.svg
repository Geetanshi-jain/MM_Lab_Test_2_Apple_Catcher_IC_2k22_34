<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="goldGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="30%" stop-color="#ffdc33"/>
      <stop offset="75%" stop-color="#e69500"/>
      <stop offset="100%" stop-color="#995c00"/>
    </radialGradient>
    <linearGradient id="leafGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="100%" stop-color="#cca300"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Stem -->
  <path d="M20 10 Q21 4 25 3" stroke="#805500" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M21 7 Q27 5 28 10 Q24 12 21 7 Z" fill="url(#leafGold)"/>
  <!-- Apple Body with glow -->
  <path d="M20 12 C13 7 7 13 8 22 C9 30 15 36 20 34 C25 36 31 30 32 22 C33 13 27 7 20 12 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Highlights & Sparkle -->
  <ellipse cx="14" cy="17" rx="3.5" ry="2" fill="#ffffff" opacity="0.7" transform="rotate(-30 14 17)"/>
  <!-- 4-point Sparkle 1 -->
  <path d="M28 14 Q29 16 31 17 Q29 18 28 20 Q27 18 25 17 Q27 16 28 14 Z" fill="#ffffff" opacity="0.9"/>
  <!-- Sparkle 2 -->
  <path d="M12 29 Q12.5 30 13.5 30.5 Q12.5 31 12 32 Q11.5 31 10.5 30.5 Q11.5 30 12 29 Z" fill="#ffffff" opacity="0.8"/>
